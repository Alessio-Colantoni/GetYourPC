server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=8h
server.forward-headers-strategy=framework

spring.session.timeout=8h
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 */15 * * * *

app.maintenance.cleanup-cron=${MAINTENANCE_CLEANUP_CRON:0 */15 * * * *}
app.auth.forgot-password-minimum-response-ms=${FORGOT_PASSWORD_MINIMUM_RESPONSE_MS:1000}
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB

app.bootstrap-account.enabled=${BOOTSTRAP_ACCOUNT_ENABLED:false}
app.bootstrap-account.email=${BOOTSTRAP_ACCOUNT_EMAIL:}
app.bootstrap-account.password=${BOOTSTRAP_ACCOUNT_PASSWORD:}
app.bootstrap-account.name=${BOOTSTRAP_ACCOUNT_NAME:}
app.bootstrap-account.surname=${BOOTSTRAP_ACCOUNT_SURNAME:}

geoapify.api-key=${GEOAPIFY_API_KEY:}
geoapify.base-url=${GEOAPIFY_BASE_URL:https://api.geoapify.com}

mailjet.api-key=${MAILJET_API_KEY:}
mailjet.secret-key=${MAILJET_SECRET_KEY:}
mailjet.sender-email=${MAILJET_SENDER_EMAIL:}
mailjet.sender-name=${MAILJET_SENDER_NAME:GetYourPC}
mailjet.base-url=${MAILJET_BASE_URL:https://api.mailjet.com}
